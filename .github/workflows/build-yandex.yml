name: Build ManagerPlanner image for Yandex Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/managerplanner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Yandex Container Registry
        env:
          YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
        run: |
          key="$YC_SERVICE_ACCOUNT_KEY"
          # Accept either the raw Yandex service-account JSON key or a
          # base64-encoded value stored in GitHub Secrets.
          if [[ "$key" != \{* ]]; then
            decoded="$(printf '%s' "$key" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == \{* ]]; then key="$decoded"; fi
          fi
          if [[ "$key" != \{* ]]; then
            echo "YC_SERVICE_ACCOUNT_KEY is not a raw or base64-encoded JSON key" >&2
            exit 1
          fi
          printf '%s' "$key" | docker login cr.yandex --username json_key --password-stdin

      - name: Build image
        run: docker build --tag "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
